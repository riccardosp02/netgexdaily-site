    <style>
        :root {
            --bg: #FAFAF8;
            --bg-alt: #F2F3EF;
            --ink: #23272A;
            --ink-soft: #6B716B;
            --line: #E4E6DF;
            --teal: #1D9E75;
            --teal-soft: #E1F5EE;
            --rust: #E0703F;
            --rust-soft: #FBEBE1;
        }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Evita doppie barre di scorrimento su Google Sites */
        }
        body {
            font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg) !important;
        }
        #chart-title { font-family: 'Newsreader', Georgia, serif !important; font-weight: 600 !important; color: var(--ink) !important; }
        /* Sostituzione dell'accent Tailwind (indigo) con il teal del brand */
        .peer-checked\:bg-indigo-600:where(.peer:checked ~ *) { background-color: var(--teal) !important; }
        .text-indigo-600 { color: var(--teal) !important; }
        .hover\:text-indigo-600:hover { color: var(--teal) !important; }
        .bg-indigo-600 { background-color: var(--teal) !important; }
        .hover\:bg-indigo-100:hover { background-color: var(--teal-soft) !important; }
        .focus\:ring-indigo-400:focus { --tw-ring-color: var(--teal) !important; }
        .text-emerald-600 { color: var(--teal) !important; }
        .bg-emerald-50 { background-color: var(--teal-soft) !important; }
        .bg-emerald-500 { background-color: var(--teal) !important; }
        .text-rose-600 { color: #B5502C !important; }
        .bg-rose-50 { background-color: var(--rust-soft) !important; }
        .bg-rose-500 { background-color: var(--rust) !important; }
        .charts-wrapper {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            gap: 16px;
            min-height: 0;
            overflow-y: auto; /* Consente lo scorrimento verticale dei grafici */
            padding-right: 6px; /* Evita che la scrollbar si sovrapponga al contenuto */
        }
        .chart-panel {
            position: relative;
            height: 44vh; /* Mostra circa due grafici per schermata */
            min-height: 320px; /* Altezza minima di sicurezza per una visualizzazione ottimale */
            width: 100%;
            flex-shrink: 0; /* Impedisce ai pannelli di comprimersi */
        }
        /* Personalizzazione barra di scorrimento interna per un look premium */
        .charts-wrapper::-webkit-scrollbar {
            width: 6px;
        }
        .charts-wrapper::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 8px;
        }
        .charts-wrapper::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }
        .charts-wrapper::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

    <script>
        // URL del "Master Index": elenca tutti i giorni disponibili e il relativo CSV pubblicato
        const MASTER_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRcBhHiCZ7gurJNv6p9xbTkLHzrObPz-8D3xKUE3dYXt8t54btmzL-VfYxwbMwplGGRnG9SvWy8gCk0/pub?gid=0&single=true&output=csv';
        const UPDATE_INTERVAL = 60000; // 60 secondi

        let availableDays = [];      // [{ label, url, dateObj }], ordinati dal più recente al più vecchio
        let currentDayUrl = null;    // URL CSV del giorno correntemente selezionato
        let currentDayLabel = '';    // Etichetta (data) del giorno correntemente selezionato

        let chartTopInstance = null;
        let chartCvdInstance = null;
        let chartBottomInstance = null;
        let countdownValue = UPDATE_INTERVAL / 1000;
        let countdownTimer = null;
        let updateTimer = null;
        let eventsBound = false;
        
        const showCrosshair = true;
        const showData = true;      
        let showTooltip = true;   
        let show21to22Data = true;
        let showEma9State = false;
        
        let showPanelTop = true;
        let showPanelCvd = false;       // Disattivato di base
        let showPanelBottom = true;
        let rawChartData = [];
        let activeFilteredData = [];

        const panelTop = document.getElementById('panel-top');
        const panelCvd = document.getElementById('panel-cvd');
        const panelBottom = document.getElementById('panel-bottom');
        const tooltipToggle = document.getElementById('tooltip-toggle');
        const timeFilterToggle = document.getElementById('time-filter-toggle');
        const emaToggle = document.getElementById('ema-toggle');

        const panelsMenuBtn = document.getElementById('panels-menu-btn');
        const panelsMenuDropdown = document.getElementById('panels-menu-dropdown');
        const panelsMenuArrow = document.getElementById('panels-menu-arrow');
        const panelTopCheckbox = document.getElementById('panel-top-checkbox');
        const panelCvdCheckbox = document.getElementById('panel-cvd-checkbox');
        const panelBottomCheckbox = document.getElementById('panel-bottom-checkbox');

        panelsMenuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isHidden = panelsMenuDropdown.classList.contains('hidden');
            if (isHidden) {
                panelsMenuDropdown.classList.remove('hidden');
                panelsMenuArrow.classList.add('rotate-180');
            } else {
                panelsMenuDropdown.classList.add('hidden');
                panelsMenuArrow.classList.remove('rotate-180');
            }
        });

        document.addEventListener('click', (e) => {
            if (!document.getElementById('panels-menu-container').contains(e.target)) {
                panelsMenuDropdown.classList.add('hidden');
                panelsMenuArrow.classList.remove('rotate-180');
            }
        });

        function applyPanelsVisibility() {
            if (showPanelTop) {
                panelTop.classList.remove('hidden');
            } else {
                panelTop.classList.add('hidden');
            }

            if (showPanelCvd) {
                panelCvd.classList.remove('hidden');
            } else {
                panelCvd.classList.add('hidden');
            }

            if (showPanelBottom) {
                panelBottom.classList.remove('hidden');
            } else {
                panelBottom.classList.add('hidden');
            }

            const visiblePanels = [];
            if (showPanelTop) visiblePanels.push(panelTop);
            if (showPanelCvd) visiblePanels.push(panelCvd);
            if (showPanelBottom) visiblePanels.push(panelBottom);

            panelTop.classList.remove('border-t', 'pt-1');
            panelCvd.classList.remove('border-t', 'pt-1');
            panelBottom.classList.remove('border-t', 'pt-1');

            for (let i = 1; i < visiblePanels.length; i++) {
                visiblePanels[i].classList.add('border-t', 'pt-1');
            }

            setTimeout(() => {
                if (chartTopInstance) chartTopInstance.resize();
                if (chartCvdInstance) chartCvdInstance.resize();
                if (chartBottomInstance) chartBottomInstance.resize();
            }, 50);
        }

        panelTopCheckbox.addEventListener('change', (e) => {
            showPanelTop = e.target.checked;
            applyPanelsVisibility();
        });
        panelCvdCheckbox.addEventListener('change', (e) => {
            showPanelCvd = e.target.checked;
            applyPanelsVisibility();
        });
        emaToggle.addEventListener('change', (e) => {
            showEma9State = e.target.checked;
            filterAndRenderData();
        });
        panelBottomCheckbox.addEventListener('change', (e) => {
            showPanelBottom = e.target.checked;
            applyPanelsVisibility();
        });
        tooltipToggle.addEventListener('change', (e) => {
            showTooltip = e.target.checked;
            updateTooltipVisibility();
        });
        timeFilterToggle.addEventListener('change', (e) => {
            show21to22Data = e.target.checked;
            filterAndRenderData();
        });

        function updateTooltipVisibility() {
            [chartTopInstance, chartCvdInstance, chartBottomInstance].forEach(chart => {
                if (chart) {
                    chart.options.plugins.tooltip.enabled = showTooltip;
                    chart.update('none');
                }
            });
        }

        // Forza la formattazione a 24 ore escludendo AM/PM
        function formatTimeItalian(dateObj) {
            return dateObj.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit', hour12: false });
        }

        function filterAndRenderData() {
            let filteredData = [...rawChartData];
            
            // Se i dati delle 21-22 sono disabilitati, filtriamo completamente l'array per eliminare lo spazio sul grafico
            if (!show21to22Data) {
                filteredData = filteredData.filter(d => {
                    const hours = d.time.getHours();
                    const minutes = d.time.getMinutes();
                    const seconds = d.time.getSeconds();
                    
                    const totalSeconds = hours * 3600 + minutes * 60 + seconds;
                    const startSeconds = 21 * 3600; // 21:00:00
                    const endSeconds = 22 * 3600;   // 22:00:00
                    
                    return !(totalSeconds >= startSeconds && totalSeconds <= endSeconds);
                });
            }

            const validRecords = filteredData.filter(d => d.netGex !== null);
            const latestRecord = validRecords[validRecords.length - 1];
            const dayPrefix = currentDayLabel ? `[${currentDayLabel}] ` : '';
            if (latestRecord && latestRecord.time) {
                const formattedTime = formatTimeItalian(latestRecord.time);
                document.getElementById('chart-title').textContent = `${dayPrefix}GEX, Volume & Spot Trend (Crawler) - Last check at ${formattedTime}`;
            } else {
                document.getElementById('chart-title').textContent = `${dayPrefix}GEX, Volume & Spot Trend (Crawler)`;
            }

            activeFilteredData = filteredData;
            renderCharts(filteredData);
        }

        function bindGroupCrosshairEvents(canvasElement, currentChart, chartsGroup) {
            function findIndexByTimestamp(datasetData, timestamp) {
                if (!datasetData || !timestamp) return -1;
                const targetTime = new Date(timestamp).getTime();
                return datasetData.findIndex(item => item && item.x && new Date(item.x).getTime() === targetTime);
            }

            canvasElement.addEventListener('mousemove', (e) => {
                if (!showCrosshair) return;

                const rect = canvasElement.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                const points = currentChart.getElementsAtEventForMode(e, 'index', { intersect: false }, true);
                if (points.length > 0) {
                    const activeElement = points[0];
                    const indexInActive = activeElement.index;
                    const activeDS = currentChart.data.datasets[activeElement.datasetIndex];

                    if (activeDS && activeDS.data && activeDS.data[indexInActive]) {
                        const timestamp = activeDS.data[indexInActive].x;

                        chartsGroup.forEach(targetChart => {
                            if (!targetChart || targetChart.canvas.offsetParent === null) return;

                            const pixelTarget = targetChart.scales.x.getPixelForValue(timestamp);
                            targetChart.crosshair = { x: pixelTarget };

                            const targetActive = [];
                            for (let i = 0; i < targetChart.data.datasets.length; i++) {
                                if (targetChart.isDatasetVisible(i)) {
                                    const dsIndex = findIndexByTimestamp(targetChart.data.datasets[i].data, timestamp);
                                    if (dsIndex !== -1) {
                                        targetActive.push({ datasetIndex: i, index: dsIndex });
                                    }
                                }
                            }
                            const tooltipY = (targetChart === currentChart) ? y : (targetChart.chartArea.top + (targetChart.chartArea.bottom - targetChart.chartArea.top) / 2);
                            
                            if (showTooltip) {
                                targetChart.tooltip.setActiveElements(targetActive, { 
                                    x: pixelTarget, 
                                    y: tooltipY 
                                });
                            } else {
                                targetChart.tooltip.setActiveElements([], { x: 0, y: 0 });
                            }
                            targetChart.update('none');
                        });
                    }
                }
            });

            canvasElement.addEventListener('mouseleave', () => {
                chartsGroup.forEach(targetChart => {
                    if (!targetChart) return;
                    targetChart.crosshair = { x: null };
                    targetChart.tooltip.setActiveElements([], { x: 0, y: 0 });
                    targetChart.update('none');
                });
            });

        function parseCSVLine(text, delimiter = ',') {
            let p = '', c = '', r = [];
            let q = false;
            for (let i = 0; i < text.length; i++) {
                c = text[i];
                if (c === '"') {
                    q = !q;
                } else if (c === delimiter && !q) {
                    r.push(p.trim());
                    p = '';
                } else {
                    p += c;
                }
            }
            r.push(p.trim());
            return r;
        }

        function safeParseFloat(valStr) {
            if (valStr === undefined || valStr.trim() === '') return null;
            let cleanStr = valStr.trim().replace(',', '.');
            const num = parseFloat(cleanStr);
            return isNaN(num) ? null : num;
        }

        function detectCSVBaseDate(lines, headers, delimiter) {
            const gexDateIndex = headers.indexOf('gex_datetime');
            const timeIndex = headers.indexOf('crawler_check_time');
            
            for (let i = 1; i < Math.min(lines.length, 100); i++) {
                if (lines[i].trim() === '') continue;
                const currentline = parseCSVLine(lines[i], delimiter);
                
                if (gexDateIndex !== -1 && currentline[gexDateIndex]) {
                    const val = currentline[gexDateIndex].trim();
                    const matchISO = val.match(/^(\d{4})[-/](\d{2})[-/](\d{2})/);
                    if (matchISO) {
                        return new Date(parseInt(matchISO[1], 10), parseInt(matchISO[2], 10) - 1, parseInt(matchISO[3], 10));
                    }
                    const matchEuro = val.match(/^(\d{1,2})[-/](\d{2})[-/](\d{4})/);
                    if (matchEuro) {
                        return new Date(parseInt(matchEuro[3], 10), parseInt(matchEuro[2], 10) - 1, parseInt(matchEuro[1], 10));
                    }
                }
                
                if (timeIndex !== -1 && currentline[timeIndex]) {
                    const val = currentline[timeIndex].trim();
                    const matchISO = val.match(/^(\d{4})[-/](\d{2})[-/](\d{2})/);
                    if (matchISO) {
                        return new Date(parseInt(matchISO[1], 10), parseInt(matchISO[2], 10) - 1, parseInt(matchISO[3], 10));
                    }
                    const matchEuro = val.match(/^(\d{1,2})[-/](\d{2})[-/](\d{4})/);
                    if (matchEuro) {
                        return new Date(parseInt(matchEuro[3], 10), parseInt(matchEuro[2], 10) - 1, parseInt(matchEuro[1], 10));
                    }
                }
            }
            return null;
        }

        function parseFlexibleDate(dateStr, baseDateStr, fallbackDate) {
            if (!dateStr) return new Date(NaN);
            dateStr = dateStr.trim();
            let baseYear = null;
            let baseMonth = null;
            let baseDay = null;

            if (baseDateStr) {
                baseDateStr = baseDateStr.trim();
                const matchISO = baseDateStr.match(/^(\d{4})[-/](\d{2})[-/](\d{2})/);
                if (matchISO) {
                    baseYear = parseInt(matchISO[1], 10);
                    baseMonth = parseInt(matchISO[2], 10) - 1;
                    baseDay = parseInt(matchISO[3], 10);
                } else {
                    const matchEuro = baseDateStr.match(/^(\d{1,2})[-/](\d{2})[-/](\d{4})/);
                    if (matchEuro) {
                        baseYear = parseInt(matchEuro[3], 10);
                        baseMonth = parseInt(matchEuro[2], 10) - 1;
                        baseDay = parseInt(matchEuro[1], 10);
                    }
                }
            }

            if (baseYear === null) {
                const matchISO = dateStr.match(/^(\d{4})[-/](\d{2})[-/](\d{2})/);
                if (matchISO) {
                    baseYear = parseInt(matchISO[1], 10);
                    baseMonth = parseInt(matchISO[2], 10) - 1;
                    baseDay = parseInt(matchISO[3], 10);
                } else {
                    const matchEuro = dateStr.match(/^(\d{1,2})[-/](\d{2})[-/](\d{4})/);
                    if (matchEuro) {
                        baseYear = parseInt(matchEuro[3], 10);
                        baseMonth = parseInt(matchEuro[2], 10) - 1;
                        baseDay = parseInt(matchEuro[1], 10);
                    }
                }
            }

            if (baseYear === null && fallbackDate) {
                baseYear = fallbackDate.getFullYear();
                baseMonth = fallbackDate.getMonth();
                baseDay = fallbackDate.getDate();
            }

            if (baseYear === null) {
                const now = new Date();
                baseYear = now.getFullYear();
                baseMonth = now.getMonth();
                baseDay = now.getDate();
            }

            const timeMatch = dateStr.match(/(?:^|\s)(\d{1,2}):(\d{2})(?::(\d{2}))?(?:$|\s)/);
            if (timeMatch) {
                const hours = parseInt(timeMatch[1], 10);
                const minutes = parseInt(timeMatch[2], 10);
                const seconds = timeMatch[3] ? parseInt(timeMatch[3], 10) : 0;
                return new Date(baseYear, baseMonth, baseDay, hours, minutes, seconds);
            }

            let parsed = new Date(dateStr);
            if (!isNaN(parsed.getTime())) return parsed;

            return new Date(NaN);
        }

        function csvToJSON(csvText) {
            const lines = csvText.split(/\r?\n/);
            if (lines.length === 0 || lines[0].trim() === '') return [];
            let headerLineIndex = -1;
            let headers = [];
            let delimiter = ',';
            const testDelimiters = [',', ';', '\t'];
            for (let i = 0; i < Math.min(lines.length, 10); i++) {
                if (lines[i].trim() === '') continue;
                const line = lines[i];
                for (const d of testDelimiters) {
                    let tempHeaders = parseCSVLine(line, d);
                    tempHeaders = tempHeaders.map(h => h.replace(/^\uFEFF/, '').trim());
                    if (tempHeaders.includes('crawler_check_time')) {
                        headers = tempHeaders;
                        headerLineIndex = i;
                        delimiter = d;
                        break;
                    }
                }
                if (headers.length > 0) break;
            }
            if (headers.length === 0) {
                headers = parseCSVLine(lines[0], ',').map(h => h.replace(/^\uFEFF/, '').trim());
                headerLineIndex = 0;
                delimiter = ',';
            }

            const fallbackDate = detectCSVBaseDate(lines, headers, delimiter);

            const timeIndex = headers.indexOf('crawler_check_time');
            const mposIndex = headers.indexOf('mpos_vol');
            const mnegIndex = headers.indexOf('mneg_vol');
            const spotIndex = headers.indexOf('spot');
            const netGexIndex = headers.indexOf('net_gex_vol');
            const gexDateIndex = headers.indexOf('gex_datetime');
            const zeroGammaIndex = headers.indexOf('zero_gamma');
            const cvdIndex = headers.findIndex(h => h.toLowerCase() === 'cvd' || h.toLowerCase() === 'cvd_vol' || h.toLowerCase() === 'cvd_val');
            // Rilevamento banda_superiore / banda_inferiore (expected move)
            const bandaSuperioreIndex = headers.findIndex(h => h.toLowerCase() === 'banda_superiore' || h.toLowerCase() === 'bandasuperiore' || h.toLowerCase() === 'sd1_plus' || h.toLowerCase() === 'sd1_pos' || h.toLowerCase() === '+1sd');
            const bandaInferioreIndex = headers.findIndex(h => h.toLowerCase() === 'banda_inferiore' || h.toLowerCase() === 'bandainferiore' || h.toLowerCase() === 'sd1_minus' || h.toLowerCase() === 'sd1_neg' || h.toLowerCase() === '-1sd');
            
            if (timeIndex === -1 || netGexIndex === -1) {
                console.error("Intestazioni trovate:", headers, "Delimitatore usato:", delimiter);
                throw new Error("Colonne richieste non trovate.");
            }
            const result = [];
            for (let i = headerLineIndex + 1; i < lines.length; i++) {
                if (lines[i].trim() === '') continue;
                const currentline = parseCSVLine(lines[i], delimiter);
                const maxIndex = Math.max(timeIndex, mposIndex, mnegIndex, spotIndex, netGexIndex, zeroGammaIndex);
                if (currentline.length <= maxIndex) continue;
                const rawDate = currentline[timeIndex];
                const rawBaseDate = (gexDateIndex !== -1) ? currentline[gexDateIndex] : '';
                
                const parsedDate = parseFlexibleDate(rawDate, rawBaseDate, fallbackDate);
                
                if (isNaN(parsedDate.getTime())) continue;
                const parsedNetGex = safeParseFloat(currentline[netGexIndex]);
                const parsedMpos = safeParseFloat(currentline[mposIndex]);
                const parsedMneg = safeParseFloat(currentline[mnegIndex]);
                const parsedSpot = (spotIndex !== -1) ? safeParseFloat(currentline[spotIndex]) : null;
                const parsedZeroGamma = (zeroGammaIndex !== -1) ? safeParseFloat(currentline[zeroGammaIndex]) : null;
                const parsedCvd = (cvdIndex !== -1) ? safeParseFloat(currentline[cvdIndex]) : null;
                const parsedBandaSuperiore = (bandaSuperioreIndex !== -1) ? safeParseFloat(currentline[bandaSuperioreIndex]) : null;
                const parsedBandaInferiore = (bandaInferioreIndex !== -1) ? safeParseFloat(currentline[bandaInferioreIndex]) : null;
                if (parsedNetGex !== null) {
                    result.push({ time: parsedDate, mpos: parsedMpos, mneg: parsedMneg, spot: parsedSpot, zeroGamma: parsedZeroGamma, netGex: parsedNetGex, cvd: parsedCvd, bandaSuperiore: parsedBandaSuperiore, bandaInferiore: parsedBandaInferiore });
                }
            }
            return result.sort((a, b) => a.time - b.time);
        }

        function calculateEMA(data, period) {
            let ema = [];
            let k = 2 / (period + 1);
            let sum = 0;
            let validCount = 0;

            for (let i = 0; i < data.length; i++) {
                if (data[i] === null) {
                    ema.push(null);
                    continue;
                }
                validCount++;
                if (validCount < period) {
                    sum += data[i];
                    ema.push(null);
                } else if (validCount === period) {
                    sum += data[i];
                    let initialEma = sum / period;
                    ema.push(initialEma);
                } else {
                    let prevEma = null;
                    for (let j = i - 1; j >= 0; j--) {
                        if (ema[j] !== null) {
                            prevEma = ema[j];
                            break;
                        }
                    }
                    if (prevEma !== null) {
                        ema.push(data[i] * k + prevEma * (1 - k));
                    } else {
                        ema.push(null);
                    }
                }
            }
            return ema;
        }

        const verticalLinePlugin = {
            id: 'verticalLine',
            afterDraw: (chart) => {
                if (chart.crosshair && chart.crosshair.x !== null) {
                    const x = chart.crosshair.x;
                    const ctx = chart.ctx;
                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(x, chart.chartArea.top);
                    ctx.lineTo(x, chart.chartArea.bottom);
                    ctx.lineWidth = 1;
                    ctx.setLineDash([4, 4]);
                    ctx.strokeStyle = 'rgba(71, 85, 105, 0.4)';
                    ctx.stroke();
                    ctx.restore();
                }
            }
        };

            const baseConfig = {

                options: {

                    maintainAspectRatio: false,
                    animation: false,
                    interaction: { mode: 'index', intersect: false },

            // Fusione sicura e selettiva per non distruggere le configurazioni base dei tooltip e della legenda
            if (optionsOverride.scales) {
                Object.assign(baseConfig.options.scales, optionsOverride.scales);
            }
            if (optionsOverride.plugins) {

                if (optionsOverride.plugins.legend) {

            Object.assign(baseConfig.options, otherOverrides);

            return baseConfig;

                        const {ctx, chartArea} = chart;
                        if (!chartArea) return 'rgba(107, 113, 107, 0.05)';
                        const yAxis = chart.scales.y;
                        const yZero = yAxis.getPixelForValue(0);
                        const top = chartArea.top;
                        const bottom = chartArea.bottom;
                        let zeroRatio = (yZero - top) / (bottom - top);
                        
                        if (isNaN(zeroRatio) || !isFinite(zeroRatio)) {
                            zeroRatio = 0.5;
                        } else {
                            zeroRatio = Math.max(0, Math.min(1, zeroRatio));
                        }

                        const gradient = ctx.createLinearGradient(0, top, 0, bottom);
                        gradient.addColorStop(0, 'rgba(29, 158, 117, 0.18)'); 
                        gradient.addColorStop(zeroRatio, 'rgba(29, 158, 117, 0.01)');
                        gradient.addColorStop(zeroRatio, 'rgba(224, 112, 63, 0.01)');
                        gradient.addColorStop(1, 'rgba(224, 112, 63, 0.18)'); 
                        return gradient;
                    },
                    borderWidth: 2,
                    fill: 'origin',
                    pointRadius: 2.5,
                    pointBackgroundColor: function(context) {
                        const index = context.dataIndex;
                        const datum = context.dataset.data[index];
                        if (!datum || datum.y === null) return '#6B716B';
                        return datum.y >= 0 ? 'rgb(29, 158, 117)' : 'rgb(224, 112, 63)';
                    },
                    pointBorderColor: function(context) {
                        const index = context.dataIndex;
                        const datum = context.dataset.data[index];
                        if (!datum || datum.y === null) return '#6B716B';
                        return datum.y >= 0 ? 'rgb(29, 158, 117)' : 'rgb(224, 112, 63)';
                    },
                    pointHoverRadius: 4.5,
                    spanGaps: false
                },
                {
                    label: 'Linea Zero',
                    data: data.map(d => ({ x: d.time, y: 0 })),
                    borderColor: 'rgba(71, 85, 105, 0.4)',
                    borderWidth: 1.2,
                    borderDash: [3, 3],
                    pointRadius: 0,
                    fill: false
                },
                {
                    label: 'Soglia +50.000',
                    data: data.map(d => ({ x: d.time, y: 50000 })),
                    borderColor: 'rgba(71, 85, 105, 0.6)',
                    borderWidth: 1.5,
                    borderDash: [5, 5],
                    pointRadius: 0,
                    fill: false
                },
                {
                    label: 'Soglia -50.000',
                    data: data.map(d => ({ x: d.time, y: -50000 })),
                    borderColor: 'rgba(71, 85, 105, 0.6)',
                    borderWidth: 1.5,
                    borderDash: [5, 5],
                    pointRadius: 0,
                    fill: false
                }
            ];

            if (chartBottomInstance) {
                chartBottomInstance.options.scales.x.min = minTime;
                chartBottomInstance.options.scales.x.max = maxTime;
                chartBottomInstance.data.datasets = bottomDatasets;
                chartBottomInstance.update('none');
                chartsGroup.push(chartBottomInstance);
            } else {
                const ctxBottom = document.getElementById('chartBottom').getContext('2d');
                chartBottomInstance = new Chart(ctxBottom, createChartConfig('bottom', bottomDatasets, 'Net Gamma Vol', {
                    scales: {
                        x: {
                            type: 'time',
                            min: minTime,
                            max: maxTime,
                            time: {
                                parser: 'iso',
                                unit: 'minute',
                                stepSize: 30,
                                displayFormats: { minute: 'HH:mm', hour: 'HH:mm' }
                            },
                            grid: { color: 'rgba(241, 245, 249, 1)', drawTicks: false },
                            ticks: { font: { size: 8, family: 'monospace' }, color: '#64748b', maxRotation: 0, autoSkip: true, padding: 4 }
                        },
                        y: {
                            grid: { color: 'rgba(241, 245, 249, 1)' },
                            ticks: { font: { size: 8 }, color: '#64748b', padding: 4 }
                        }
                    },
                    plugins: {
                        tooltip: {
                            filter: function(tooltipItem) {
                                return tooltipItem.datasetIndex === 0;
                            }
                        }
                    }
                }));
                chartsGroup.push(chartBottomInstance);
            }

            if (!eventsBound) {
                bindGroupCrosshairEvents(chartTopInstance.canvas, chartTopInstance, chartsGroup);
                bindGroupCrosshairEvents(chartCvdInstance.canvas, chartCvdInstance, chartsGroup);
                bindGroupCrosshairEvents(chartBottomInstance.canvas, chartBottomInstance, chartsGroup);
                eventsBound = true;
            }
        }

        async function fetchAndRenderData(isSilent = false) {
            if (!currentDayUrl) return;
            if (!isSilent) showOverlay('Downloading data from Google Sheets...');
            updateStatus('Downloading...', 'loading');
            try {
                const response = await fetch(currentDayUrl + '&t=' + new Date().getTime());
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const csvText = await response.text();
                const parsedData = csvToJSON(csvText);
                if (parsedData.length === 0) throw new Error("Il file CSV è vuoto o non formattato correttamente.");
                rawChartData = parsedData;
                hideOverlay();
                filterAndRenderData();
                const nowStr = formatTimeItalian(new Date());
                document.getElementById('last-update').textContent = `Last check: ${nowStr}`;
                updateStatus('Data updated');
                resetCountdown();
            } catch (error) {
                console.error("Download error:", error);
                hideOverlay();
                if (rawChartData.length === 0) showOverlay(`Error: ${error.message}. Check the link or publication.`, true);
                updateStatus('Update error', 'error');
                resetCountdown();
            }
        }

        // --- Gestione Master Index (elenco giorni) ---

        function parseItalianDateLabel(label) {
            if (!label) return null;
            const parts = label.trim().split(/[\/\-]/);
            if (parts.length !== 3) return null;
            let [d, m, y] = parts.map(p => parseInt(p, 10));
            if (!d || !m || !y) return null;
            if (y < 100) y += 2000;
            const dateObj = new Date(y, m - 1, d);
            return isNaN(dateObj.getTime()) ? null : dateObj;
        }

        function parseMasterCSV(csvText) {
            const lines = csvText.split(/\r?\n/);
            if (lines.length === 0) return [];
            const headers = parseCSVLine(lines[0], ',').map(h => h.replace(/^\uFEFF/, '').trim().toLowerCase());
            const labelIndex = headers.indexOf('label');
            const urlIndex = headers.indexOf('url');
            if (labelIndex === -1 || urlIndex === -1) {
                throw new Error("Il Master Index non contiene le colonne 'label' e 'url'.");
            }
            const days = [];
            const maxSensibleDate = new Date();
            maxSensibleDate.setDate(maxSensibleDate.getDate() + 2); // margine di sicurezza (fuso orario)

            for (let i = 1; i < lines.length; i++) {
                if (lines[i].trim() === '') continue;
                const row = parseCSVLine(lines[i], ',');
                const label = row[labelIndex] ? row[labelIndex].trim() : '';
                const url = row[urlIndex] ? row[urlIndex].trim() : '';
                if (!label || !url || !url.startsWith('http')) continue; // salta giorni senza CSV pubblicato
                const dateObj = parseItalianDateLabel(label);
                if (dateObj && dateObj > maxSensibleDate) {
                    console.warn(`Master Index: the date "${label}" looks wrong (in the future) and is being ignored. Check the Google Sheet.`);
                    continue;
                }
                days.push({ label, url, dateObj });
            }
            // Ordina dal più recente al più vecchio; le date non parsabili finiscono in fondo
            days.sort((a, b) => {
                if (a.dateObj && b.dateObj) return b.dateObj - a.dateObj;
                if (a.dateObj) return -1;
                if (b.dateObj) return 1;
                return 0;
            });
            return days;
        }

        // --- Calendario giorno selezionato ---

        let calViewYear = null;   // anno attualmente mostrato nel popup calendario
        let calViewMonth = null;  // mese (0-11) attualmente mostrato nel popup calendario
        let currentDayIndex = null;

        const MESI_IT = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        const GIORNI_IT = ['Mo','Tu','We','Th','Fr','Sa','Su'];

        function sameDate(a, b) {
            return a && b && a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
        }

        function renderCalendar() {
            document.getElementById('cal-month-label').textContent = `${MESI_IT[calViewMonth]} ${calViewYear}`;

            const weekdaysEl = document.getElementById('cal-weekdays');
            weekdaysEl.innerHTML = GIORNI_IT.map(g => `<div>${g}</div>`).join('');

            const daysEl = document.getElementById('cal-days');
            daysEl.innerHTML = '';

            const firstOfMonth = new Date(calViewYear, calViewMonth, 1);
            // Lunedì = 0 ... Domenica = 6
            let leadingBlanks = (firstOfMonth.getDay() + 6) % 7;
            const daysInMonth = new Date(calViewYear, calViewMonth + 1, 0).getDate();

            for (let i = 0; i < leadingBlanks; i++) {
                daysEl.appendChild(document.createElement('div'));
            }

            const selectedDate = (currentDayIndex !== null && availableDays[currentDayIndex]) ? availableDays[currentDayIndex].dateObj : null;

            for (let d = 1; d <= daysInMonth; d++) {
                const cellDate = new Date(calViewYear, calViewMonth, d);
                const matchIdx = availableDays.findIndex(day => sameDate(day.dateObj, cellDate));
                const isAvailable = matchIdx !== -1;
                const isSelected = sameDate(cellDate, selectedDate);

                const cell = document.createElement('button');
                cell.type = 'button';
                cell.textContent = String(d);
                cell.className = 'py-1 rounded-full text-xs transition-colors';

                if (isSelected) {
                    cell.classList.add('bg-indigo-600', 'text-white', 'font-bold');
                } else if (isAvailable) {
                    cell.classList.add('text-indigo-600', 'font-bold', 'hover:bg-indigo-100', 'cursor-pointer');
                } else {
                    cell.classList.add('text-slate-300', 'cursor-default');
                    cell.disabled = true;
                }

                if (isAvailable) {
                    cell.addEventListener('click', () => {
                        selectDay(matchIdx, false);
                        document.getElementById('calendar-popup').classList.add('hidden');
                    });
                }

                daysEl.appendChild(cell);
            }
        }

        function openCalendarOnSelectedDay() {
            const selectedDate = (currentDayIndex !== null && availableDays[currentDayIndex]) ? availableDays[currentDayIndex].dateObj
                : (availableDays[0] ? availableDays[0].dateObj : null);
            const ref = selectedDate || new Date();
            calViewYear = ref.getFullYear();
            calViewMonth = ref.getMonth();
            renderCalendar();
        }

        function selectDay(idx, isSilent = false) {
            const day = availableDays[idx];
            if (!day) return;
            currentDayIndex = idx;
            currentDayUrl = day.url;
            currentDayLabel = day.label;
            document.getElementById('day-selector-label').textContent = day.label;
            rawChartData = [];
            clearInterval(updateTimer);
            clearInterval(countdownTimer);
            fetchAndRenderData(isSilent);
            updateTimer = setInterval(() => { fetchAndRenderData(true); }, UPDATE_INTERVAL);
        }

        async function fetchMasterAndInit() {
            showOverlay('Loading available days...');
            updateStatus('Loading days...', 'loading');
            try {
                const response = await fetch(MASTER_CSV_URL + '&t=' + new Date().getTime());
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const csvText = await response.text();
                availableDays = parseMasterCSV(csvText);
                if (availableDays.length === 0) throw new Error("No day with a published CSV found in the Master Index.");
                openCalendarOnSelectedDay();
                selectDay(0, false); // Seleziona di default il giorno più recente
            } catch (error) {
                console.error("Master Index download error:", error);
                hideOverlay();
                showOverlay(`Master Index error: ${error.message}`, true);
                updateStatus('Master Index error', 'error');
            }
        }

        function resetCountdown() {
            if (countdownTimer) clearInterval(countdownTimer);
            countdownValue = UPDATE_INTERVAL / 1000;
            document.getElementById('countdown').textContent = `${countdownValue}s`;
            
            countdownTimer = setInterval(() => {
                countdownValue--;
                document.getElementById('countdown').textContent = `${countdownValue}s`;
                if (countdownValue <= 0) clearInterval(countdownTimer);
            }, 1000);
        }

        function startAutoUpdate() {
            fetchAndRenderData();
            updateTimer = setInterval(() => { fetchAndRenderData(true); }, UPDATE_INTERVAL);
        }

        document.addEventListener('DOMContentLoaded', () => {
            applyPanelsVisibility(); // Allinea la visibilità iniziale dei pannelli coi default false
            fetchMasterAndInit();

            document.getElementById('day-selector-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                const popup = document.getElementById('calendar-popup');
                const wasHidden = popup.classList.contains('hidden');
                popup.classList.toggle('hidden');
                if (wasHidden) openCalendarOnSelectedDay();
            });

            document.getElementById('calendar-popup').addEventListener('click', (e) => e.stopPropagation());

            document.addEventListener('click', () => {
                document.getElementById('calendar-popup').classList.add('hidden');
            });

            document.getElementById('cal-prev').addEventListener('click', () => {
                calViewMonth--;
                if (calViewMonth < 0) { calViewMonth = 11; calViewYear--; }
                renderCalendar();
            });

            document.getElementById('cal-next').addEventListener('click', () => {
                calViewMonth++;
                if (calViewMonth > 11) { calViewMonth = 0; calViewYear++; }
                renderCalendar();
            });

            document.getElementById('refresh-btn').addEventListener('click', () => {
                clearInterval(updateTimer);
                clearInterval(countdownTimer);
                fetchAndRenderData(false);
                updateTimer = setInterval(() => { fetchAndRenderData(true); }, UPDATE_INTERVAL);
            });
            
            window.addEventListener('resize', () => {
                if (chartTopInstance) chartTopInstance.resize();
                if (chartCvdInstance) chartCvdInstance.resize();
                if (chartBottomInstance) chartBottomInstance.resize();
            });
        });
    </script>
</body>
